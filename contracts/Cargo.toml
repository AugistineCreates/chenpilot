[workspace]
members = [
    "contract_failure",
    "pause_state",
    "btc_relay",
    "btc_relay_crypto",
    "core_vault",
    "fee_distribution",
    "flash_loan_guard",
    "htlc",
    "intent_market_validator",
    "lending_liquidation",
    "liquidity_vault",
    "multi_hop_swap",
    "oracle_aggregator",
    "por_validator",
    "protocol_conservation",
    "rbac",
    "relayer_slashing",
    "strategy_registry",
    "strategy_boundary",
    "unified_auth",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "debuginfo"
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug = true
