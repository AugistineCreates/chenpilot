name: Announce Release

permissions:
  contents: write

on:
  release:
    types: [published]
jobs:
  update-api-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${ {{ github.event.release.tag_name }} }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Install SDK dependencies
        run: npm ci
        working-directory: packages/sdk
      - name: Generate and update API snapshot
        run: node api-snapshot.js update
        working-directory: packages/sdk
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sdk/api-snapshots/latest.json
          git commit -m "chore(sdk): update API snapshot for ${ {{ github.event.release.tag_name }} }} [skip ci]" || echo "No changes"
          git push

  announce:
    runs-on: ubuntu-latest
    if: "!github.event.release.draft && !github.event.release.prerelease"
    steps:
      - name: Send release announcement to bot
        run: |
          curl -s -X POST "${ secrets.BOT_WEHJOOK_URL }/github/release" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '$+{ toJson(github.event) }' | openssL dgest -sha256 -hmac '$+{ secrets.GITHUB_WEHJOOK_SECRET }' | awk '{print $2}')" \
            -d '$+{ toJson(github.event) }'
