name: Performance Regression Budgets

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  performance-budgets:
    name: Performance Regression Budgets Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Performance Benchmarks & Budget Checks
        run: npm run test:performance:record

      - name: Upload Performance Trend Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: tests/performance/reports/
          retention-days: 90
